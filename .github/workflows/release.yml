name: Build and validate portable DFThub
on:
  push:
    branches: ['release/**']
    tags: ['v0.1.1']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tools
        run: python -m pip install build wheel 'setuptools>=70' 'cmake<4'
      - name: Linux wheel tools
        if: runner.os == 'Linux'
        run: python -m pip install auditwheel patchelf
      - name: macOS wheel tools
        if: runner.os == 'macOS'
        run: python -m pip install delocate
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm libomp openblas
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_ARCHITECTURES=arm64" >> "$GITHUB_ENV"
          echo "_PYTHON_HOST_PLATFORM=macosx-14.0-arm64" >> "$GITHUB_ENV"
          echo "DFTHUB_MACOS_LIBOMP=$(brew --prefix libomp)/lib/libomp.dylib" >> "$GITHUB_ENV"
          echo "CMAKE_CONFIGURE_ARGS=-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DBLAS_LIBRARIES=$(brew --prefix openblas)/lib/libopenblas.dylib -DCMAKE_PREFIX_PATH=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: engine-cache
        with:
          path: dist/engine
          key: dfthub-dft-e7cb7357-native-v2-${{ matrix.os }}
      - name: Build pinned DFT engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: python tools/ci_run.py python tools/build_engine.py
      - name: Include native licenses
        run: python tools/add_native_notices.py dist/engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}
          path: dist/engine/*
  validate:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.os }}
          path: dist/engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.5.3
      - name: Frontend
        working-directory: Client/DFThub
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          node tests/test_mue_parser.cjs
          node tests/test_mue_analysis.cjs
          node tests/test_analysis_v2.cjs
          node tests/test_multi_job_analysis.cjs
      - name: Build distribution
        run: |
          python tools/sync_frontend.py
          python -m pip install build
          python -m build
          python tools/offline_bundle.py --engine dist/engine/dfthub_pyscf_dft-*.whl --package dist/dfthub-0.1.1-py3-none-any.whl
          bundle_dir=$(find dist -maxdepth 1 -type d -name 'dfthub-0.1.1-*' | head -1)
          python -m pip download --only-binary=:all: -d "$bundle_dir/wheelhouse" 'setuptools>=70' wheel
          cp deploy/install-offline.sh "$bundle_dir/deploy/install-offline.sh"
          chmod +x "$bundle_dir/deploy/install-offline.sh"
          python - "$bundle_dir" "${{ matrix.python }}" <<'PY'
          import hashlib, sys, tarfile
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          py_mm = sys.argv[2]
          py_bin = f"python{py_mm}"
          cp_tag = f"cp{py_mm.replace('.', '')}"
          bundle_name = root.name

          readme = f"""# DFThub Offline Bundle ({bundle_name})

          This offline bundle targets **Python {py_mm} ({cp_tag})** on Linux x86_64 and includes the prebuilt `dfthub` wheel, the pinned `dfthub-pyscf-dft` engine, runtime dependencies, and build wheels (`setuptools`, `wheel`) in `wheelhouse/`.

          ## 1. Offline Installation

          ### Option A: Automated verification and lockfile install (recommended)

          `deploy/install-offline.sh` automatically detects `{py_bin}` from `platform.json` (or `wheelhouse/`), verifies the platform, Python `major.minor` version and `SHA256SUMS`, creates the virtual environment, installs all locked wheels, and runs `dfthub doctor --strict`:

          ```bash
          cd {bundle_name}
          bash deploy/install-offline.sh .venv
          source .venv/bin/activate
          # Optional explicit interpreter override:
          #   DFTHUB_INSTALL_PYTHON={py_bin} bash deploy/install-offline.sh .venv
          ```

          ### Option B: Manual virtual environment and wheelhouse install

          ```bash
          cd {bundle_name}
          {py_bin} -m venv .venv
          source .venv/bin/activate
          python -m pip install --no-index --find-links ./wheelhouse dfthub
          ```

          ### Option C: Offline install from a Git source checkout

          When installing from a DFThub source checkout on an offline machine using this bundle's `wheelhouse/`:

          ```bash
          {py_bin} -m venv .venv
          source .venv/bin/activate
          python -m pip install --no-index --find-links /path/to/{bundle_name}/wheelhouse .
          # Or, if setuptools>=70 is already installed in the active environment, skip build isolation:
          python -m pip install --no-index --no-build-isolation --find-links /path/to/{bundle_name}/wheelhouse .
          ```

          ## 2. Verify and Start the Service

          ```bash
          dfthub doctor --strict
          dfthub serve --data-dir ./dfthub-data
          ```

          Then open **http://127.0.0.1:8188** in your browser.

          ## 3. Command-Line Tools Quick Start

          ```bash
          dfthub params check Parameters                 # validate; --json for machine-readable output
          dfthub params show Parameters                  # every coefficient with its LibXC name
          dfthub export pyscf    Parameters -o CF22D_optimized.py
          dfthub export gaussian Parameters -o cf22d.gjf
          dfthub export orca     Parameters -o cf22d.inp
          dfthub export psi4     Parameters -o cf22d_psi4.py
          dfthub g16 build --source ./g16 --parameters Parameters --dry-run
          dfthub pyscf demo --parameters Parameters      # H2 check; --original, --no-d3
          ```

          See `deploy/README.md` for production deployment and configuration details, and `conda/README.md` for Conda environments.
          """
          (root / 'README.md').write_text(readme)

          sums_path = root / 'SHA256SUMS'
          if sums_path.exists():
              sums_path.unlink()
          sums = [
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}"
              for p in sorted(root.rglob('*'))
              if p.is_file()
          ]
          sums_path.write_text('\n'.join(sums) + '\n')

          tar_path = root.parent / f"{bundle_name}.tar.gz"
          with tarfile.open(tar_path, 'w:gz') as archive:
              archive.add(root, arcname=bundle_name)
          PY
      - name: Fresh offline environment and regression tests
        run: |
          bundle_dir=$(find dist -maxdepth 1 -type d -name 'dfthub-0.1.1-*' | head -1)
          bash "$bundle_dir/deploy/install-offline.sh" .venv-verify
          .venv-verify/bin/python -m pip check
          python tools/ci_run.py .venv-verify/bin/python tools/run_tests.py
          python tools/ci_run.py .venv-verify/bin/python tools/scientific_smoke.py --output dist/scientific-smoke.json
          python tools/ci_run.py .venv-verify/bin/python tools/workflow_smoke.py
          python tools/audit_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/dfthub-0.1.1-*.tar.gz
            dist/dfthub-0.1.1-py3-none-any.whl
            dist/dfthub-0.1.1.tar.gz
            dist/scientific-smoke.json
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [engine, validate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -n {} release-assets/ \;
          cd release-assets
          tar -czf "dfthub-0.1.1-conda-recipe.tar.gz" -C .. conda
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "DFThub $GITHUB_REF_NAME" --notes "Portable DFThub with latest PySCF DFT e7cb7357. Linux x86_64 Python 3.10–3.12 installation and scientific checks passed; macOS source-build instructions are included." --target "$GITHUB_SHA" ./*
